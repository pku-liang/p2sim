[package]
name = "ggsim"
version = "0.1.0"
edition = "2024"

[dependencies]
index-vec-ext = { path = "crates/index-vec-ext" }
ariadne = { version = "0.5.1", features = ["auto-color"] }
askama = "0.14.0"
clap = { version = "4.5.48", features = ["derive"] }
env_logger = "0.11.8"
itertools = "0.14.0"
log = "0.4.28"
memmap2 = "0.9.8"
ordered-float = "5.0.0"
petgraph = "0.8.2"
priority-queue = "2.7.0"
rayon = "1.11.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.226", features = ["derive"] }
serde-lexpr = "0.1.3"
serde_tuple = "1.1.2"
sha1 = "0.10.6"
pathdiff = "0.2.3"
serde_json = "1.0.145"
tabular = "0.2.0"
bincode = "2.0.1"
num = "0.4.3"
keyed_priority_queue = "0.4.2"
mt-kahypar = "0.2.0"
indicatif = { version = "0.18.2", features = ["rayon"] }
paste = "1.0.15"
byteorder = "1.5.0"

[profile.dev.package.'*']
opt-level = 2
