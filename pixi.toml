[workspace]
authors = ["KEKE046 <zhoukexing@pku.edu.cn>"]
channels = ["conda-forge"]
name = "ggsim"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
clang = ">=21.1.1,<22"
clangxx = ">=21.1.1,<22"
lld = ">=21.1.1,<22"
ninja = ">=1.13.1,<2"
just = ">=1.42.4,<2"
ccache = ">=4.11.3,<5"
flex = ">=2.6.4,<3"
bison = ">=3.8.2,<4"
gmp = ">=6.3.0,<7"

[activation.env]
CXX = "clang++"
CC = "clang"
CCACHE = "ccache"
CXXFLAGS = "-I$CONDA_PREFIX/include"
LDFLAGS = "-L$CONDA_PREFIX/lib"
MAKEFLAGS = "-j$(nproc)"
